[project]
name = "hermes-initiatives"
version = "0.1.0"
description = "Hermes plugin: initiatives, cycles, a decision queue and an autonomy layer above Kanban cards"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7", "pydantic>=2.5,<3", "fastapi>=0.110,<1", "httpx>=0.27,<1"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_initiatives_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
